apiVersion: apps/v1
kind: Deployment

metadata:
  name: webapipoc

spec:
  replicas: 2

  selector:
    matchLabels:
      app: webapipoc

  template:
    metadata:
      labels:
        app: webapipoc

    spec:
      containers:
        - name: webapipoc

          image: pawancrudacrtestdemo2026-bhfnf6gqbbd3b3fd.azurecr.io/webapipoca:v1

          ports:
            - containerPort: 8080

          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"